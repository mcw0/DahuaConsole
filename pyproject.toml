[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dahua-console"
version = "0.2.0"
description = "Dahua Debug Console"
readme = "README.md"
license = "MIT"
authors = [{ name = "bashis" }]
requires-python = ">=3.9"
dependencies = [
    "pwntools>=4.11",
    # pwntools pulls in unicorn (unused here). 2.1.2 has no Apple Silicon wheel and fails to compile
    # with recent Xcode clang; 2.1.1 ships a prebuilt arm64 wheel.
    "unicorn!=2.1.2",
    "cryptography>=41",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
dahua-console = "Console:main"
dahua-eventviewer = "eventviewer:main"

[tool.setuptools]
# The project is a set of flat modules that import each other by bare name (e.g. `from utils import *`).
# Install with pipx (isolated venv) so these generic module names don't clash with anything else.
py-modules = [
    "Console",
    "connection",
    "dahua",
    "dahua_logon_modes",
    "events",
    "eventviewer",
    "net",
    "pwdmanager",
    "relay",
    "servers",
    "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Catch real errors only (syntax, undefined names, bad comparisons); the legacy code relies on
# star-imports from pwntools, so F403/F405 are ignored rather than flagged hundreds of times.
select = ["E9", "F63", "F7", "F82"]
