name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (real errors only)
        run: ruff check .
      - name: Test
        env:
          PWNLIB_NOTERM: "1"
        run: pytest -q
      - name: CLI smoke test
        env:
          PWNLIB_NOTERM: "1"
        run: dahua-console --help
